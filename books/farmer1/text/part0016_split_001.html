  <section epub:type="chapter" id="sec-chapter006" class="chapter">

    <figure class="image_full_caption_landscape" id="p119">

      <img src="../images/00014.jpeg" alt="" id="mak0000402" class="calibre18"/>

      <figcaption class="calibre16"><span id="pg119" epub:type="pagebreak" role="doc-pagebreak" aria-label="119" class="calibre"></span><a href="part0006.html#img_p119" class="calibre">Figure 8</a> (facing page). <em class="calibre4">The wilderness of bounded rationality</em>. The human brain is complicated, like a wilderness, and creating a reliable model of the way we make decisions is difficult. To avoid getting lost, it helps to start with simple assumptions and build incrementally more complicated models. Rationality is the conventional starting point used in economics, but heuristics, and even the extreme assumption of zero intelligence (random decision-making), provide useful and much less developed alternative reference points.</figcaption>

    </figure>
